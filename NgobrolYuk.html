<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>NgobrolYuk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f0f2f5;--pn:#fff;--hd:#008069;--tx:#111b21;--sb:#667781;--me:#d9fdd3;--ot:#fff;--ch:#efeae2;--ln:#e9edef;--ac:#00a884;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--pn:#111b21;--hd:#202c33;--tx:#e9edef;--sb:#8696a0;--me:#005c4b;--ot:#202c33;--ch:#0b141a;--ln:#222d34}}
:root[data-theme="dark"]{--bg:#0b141a;--pn:#111b21;--hd:#202c33;--tx:#e9edef;--sb:#8696a0;--me:#005c4b;--ot:#202c33;--ch:#0b141a;--ln:#222d34}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:var(--tx)}
#app{display:flex;height:100%;max-width:1100px;margin:auto;background:var(--pn)}
#side{width:340px;border-right:1px solid var(--ln);display:flex;flex-direction:column;min-width:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--ch)}
.top{background:var(--hd);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
.top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button{color:#fff;font-size:20px;padding:4px 8px}
#q{margin:8px;padding:9px 12px;border-radius:8px;border:0;background:var(--bg)}
#list{flex:1;overflow:auto}
.sec{padding:8px 14px;font-size:12px;color:var(--ac);font-weight:600;text-transform:uppercase}
.it{display:flex;gap:12px;align-items:center;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--ln)}
.it:hover,.it.on{background:var(--bg)}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.it small{display:block;color:var(--sb)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.m{max-width:78%;padding:6px 10px;border-radius:10px;background:var(--ot);align-self:flex-start;word-wrap:break-word;box-shadow:0 1px 1px #0002}
.m.me{background:var(--me);align-self:flex-end}
.m .n{font-size:12px;font-weight:700;color:var(--ac)}
.m .t{font-size:11px;color:var(--sb);text-align:right;margin-left:12px}
.m.st{background:none;box-shadow:none;font-size:64px;line-height:1.1;padding:0}
.m.st .t{font-size:11px}
#bar{display:flex;gap:8px;padding:8px;background:var(--bg);align-items:center}
#txt{flex:1;padding:11px 14px;border-radius:22px;border:0;background:var(--pn)}
#bar button{font-size:22px;width:42px;height:42px;border-radius:50%}
#snd{background:var(--ac);color:#fff}#mic.rec{background:#e53935;color:#fff;font-size:16px}.m audio{max-width:230px;height:36px}
#stk{display:none;flex-wrap:wrap;gap:2px;padding:8px;background:var(--pn);max-height:170px;overflow:auto;border-top:1px solid var(--ln)}
#stk button{font-size:34px;padding:2px 6px}
.empty{margin:auto;color:var(--sb);text-align:center;padding:20px}
.ov{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9;padding:16px}
.ov.on{display:grid}
.box{background:var(--pn);padding:20px;border-radius:14px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.box input[type=text]{padding:11px;border-radius:8px;border:1px solid var(--ln);background:var(--bg)}
.box .go{background:var(--ac);color:#fff;padding:11px;border-radius:8px;font-weight:600}
.err{color:#e53935;font-size:13px;min-height:16px}
.chk{max-height:160px;overflow:auto}.chk label{display:block;padding:4px 0}
#back{display:none}
@media(max-width:700px){#side{width:100%}#main{display:none}body.open #side{display:none}body.open #main{display:flex}#back{display:inline}}
</style></head><body>
<div id="app">
<div id="side"><div class="top"><div class="av" id="mav" style="width:34px;height:34px"></div><b id="mnm"></b><button id="ng" title="Grup baru">👥</button></div>
<input id="q" placeholder="Cari kontak…"><div id="list"></div></div>
<div id="main"><div class="top"><button id="back">←</button><div class="av" id="cav" style="width:34px;height:34px"></div><b id="cnm">Pilih chat</b><button id="cal" title="Telepon suara" style="display:none">📞</button></div>
<div id="msgs"><div class="empty">Pilih kontak atau Grup Publik untuk mulai ngobrol 💬</div></div>
<div id="stk"></div>
<div id="bar" style="display:none"><button id="sb">😊</button><input id="txt" placeholder="Ketik pesan" autocomplete="off"><button id="mic" title="Pesan suara">🎤</button><button id="snd">➤</button></div></div></div>

<div class="ov on" id="reg"><div class="box"><h3 style="margin:0">Daftar / Masuk</h3>
<input type="text" id="ru" placeholder="Username (huruf kecil/angka/_)" maxlength="16" autocapitalize="off">
<input type="text" id="rn" placeholder="Nickname" maxlength="24">
<div class="err" id="re"></div><button class="go" id="rg">Mulai</button></div></div>

<div class="ov" id="gm"><div class="box"><h3 style="margin:0">Grup baru</h3>
<input type="text" id="gn" placeholder="Nama grup" maxlength="30"><div class="chk" id="gc"></div>
<div class="err" id="ge"></div><button class="go" id="gg">Buat</button><button id="gx">Batal</button></div></div>

<div class="ov" id="cm"><div class="box" style="text-align:center"><div class="av" style="margin:auto;width:70px;height:70px;font-size:28px" id="cmv"></div>
<b id="cmn"></b><div id="cms" style="color:var(--sb)"></div>
<button class="go" id="cok">Terima</button><button class="go" id="cno" style="background:#e53935">Tutup</button></div></div>
<audio id="aud" autoplay></audio>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STK="😀😂🤣🥰😍😎🤔😭😡🥳😴🤯😇🙈👍👎👏🙏🤝🔥💯❤️💔🎉🎂🐱🐶🍕☕⚽🚀🌈".match(/\p{Extended_Pictographic}\uFE0F?/gu);
let db,user,room,uid,me=null,cur=null,unsub=null,users={},groups={},msgs=[];
const PUB={id:"public",name:"🌍 Grup Publik",group:1};
const ini=s=>(s||"?").trim()[0].toUpperCase();
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

async function init(){
 db=await claude.use("db");user=await claude.use("user");room=await claude.use("room");
 if(!db||!user){$("#re").textContent="Buka lewat claude.ai (sudah login) supaya chat online aktif.";return}
 uid=await user.id();
 const s=ld("nx_me");if(s){try{const o=JSON.parse(s),d=await db.collection("users").doc(o.u).get();if(d.exists&&d.data().uid===uid){enter(o);return}}catch(e){}}
}
$("#rg").onclick=async()=>{
 const u=$("#ru").value.trim().toLowerCase(),n=$("#rn").value.trim(),e=$("#re");
 if(!/^[a-z0-9_]{3,16}$/.test(u))return e.textContent="Username 3-16 karakter: a-z, 0-9, _";
 if(!n)return e.textContent="Isi nickname";
 try{const r=db.collection("users").doc(u),d=await r.get();
  if(d.exists&&d.data().uid!==uid)return e.textContent="Username sudah dipakai";
  await r.set({nick:n,uid});const o={u,n};sv("nx_me",JSON.stringify(o));enter(o)}
 catch(x){e.textContent="Gagal: "+(x.message||x.code)}
};
function enter(o){
 me=o;$("#reg").classList.remove("on");$("#mav").textContent=ini(o.n);$("#mnm").textContent=o.n+" (@"+o.u+")";
 db.collection("users").onSnapshot(s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());list()});
 db.collection("groups").onSnapshot(s=>{groups={};s.docs.forEach(d=>groups[d.id]=d.data());list()});
 if(room)room.on("call",onSig);
 if(room)room.presence({u:o.u});
 list();
}
function dmid(a,b){return"dm~"+[a,b].sort().join("~")}
function list(){
 const f=$("#q").value.toLowerCase(),L=$("#list");let h='<div class="sec">Grup</div>';
 const gs=[PUB,...Object.entries(groups).filter(([i,g])=>(g.members||[]).includes(me.u)).map(([i,g])=>({id:"g~"+i,name:"👥 "+g.name,group:1,mem:g.members}))];
 h+=gs.map(g=>item(g.id,g.name,g.group?"Grup":"",g.id===PUB.id?"🌍":"👥")).join("");
 const us=Object.entries(users).filter(([u,d])=>u!==me.u&&(u.includes(f)||(d.nick||"").toLowerCase().includes(f)));
 h+='<div class="sec">Kontak ('+us.length+')</div>';
 h+=us.map(([u,d])=>item(dmid(me.u,u),d.nick,"@"+u,ini(d.nick),u)).join("")||'<div class="empty">Belum ada kontak lain. Ajak temanmu daftar!</div>';
 L.innerHTML=h;
}
function item(id,name,sub,av,peer){return`<button class="it ${cur&&cur.id===id?"on":""}" data-id="${esc(id)}" data-n="${esc(name)}" data-p="${peer||""}"><div class="av">${esc(av)}</div><div><b>${esc(name)}</b><small>${esc(sub)}</small></div></button>`}
$("#list").onclick=e=>{const b=e.target.closest(".it");if(b)open(b.dataset.id,b.dataset.n,b.dataset.p)};
$("#q").oninput=list;
function open(id,name,peer){
 cur={id,name,peer};if(unsub)unsub();
 $("#cnm").textContent=name;$("#cav").textContent=peer?ini(name):"👥";$("#bar").style.display="flex";
 $("#cal").style.display=room?"inline":"none";document.body.classList.add("open");list();
 msgs=[];draw();
 unsub=db.collection("msgs").where("chat","==",id).onSnapshot(s=>{msgs=s.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);draw()});
}
$("#back").onclick=()=>document.body.classList.remove("open");
function draw(){
 const M=$("#msgs"),bot=M.scrollHeight-M.scrollTop-M.clientHeight<80;
 if(!msgs.length){M.innerHTML='<div class="empty">Belum ada pesan. Sapa duluan 👋</div>';return}
 M.innerHTML=msgs.map(m=>{const mine=m.u===me.u,t=new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const nm=!cur.peer?`<div class="n" style="color:hsl(${[...m.u].reduce((h,c)=>h*31+c.charCodeAt(0),7)%360},60%,45%)">${esc((users[m.u]&&users[m.u].nick)||m.n)} <small style="font-weight:400;color:var(--sb)">@${esc(m.u)}</small></div>`:"";
  return`<div class="m ${mine?"me":""} ${m.k==="s"?"st":""}">${nm}${m.k==="v"?`<audio controls preload="none" src="${esc(m.b)}"></audio>`:esc(m.b)}<div class="t">${t}</div></div>`}).join("");
 if(bot)M.scrollTop=M.scrollHeight;
}
async function send(k,b,c){
 const chat=c||(cur&&cur.id);if(!chat||!b)return;const t=Date.now();
 try{await db.collection("msgs").doc(t+"_"+Math.random().toString(36).slice(2,7)).set({chat,u:me.u,n:me.n,k,b,t})}catch(e){alert("Gagal kirim: "+(e.message||e.code))}
}
$("#snd").onclick=()=>{const v=$("#txt").value.trim();if(v){send("t",v);$("#txt").value=""}};
$("#txt").onkeydown=e=>{if(e.key==="Enter")$("#snd").click()};
$("#stk").innerHTML=STK.map(s=>`<button>${s}</button>`).join("");
$("#sb").onclick=()=>{const s=$("#stk");s.style.display=s.style.display==="flex"?"none":"flex"};
$("#stk").onclick=e=>{if(e.target.tagName==="BUTTON"){send("s",e.target.textContent);$("#stk").style.display="none"}};

/* grup baru */
$("#ng").onclick=()=>{$("#gc").innerHTML=Object.entries(users).filter(([u])=>u!==me.u).map(([u,d])=>`<label><input type="checkbox" value="${esc(u)}"> ${esc(d.nick)} (@${esc(u)})</label>`).join("")||"Belum ada kontak";$("#ge").textContent="";$("#gm").classList.add("on")};
$("#gx").onclick=()=>$("#gm").classList.remove("on");
$("#gg").onclick=async()=>{
 const n=$("#gn").value.trim(),m=[...document.querySelectorAll("#gc input:checked")].map(i=>i.value);
 if(!n)return $("#ge").textContent="Isi nama grup";if(!m.length)return $("#ge").textContent="Pilih minimal 1 anggota";
 try{await db.collection("groups").doc("g"+Date.now().toString(36)).set({name:n,owner:me.u,members:[me.u,...m]});$("#gm").classList.remove("on");$("#gn").value=""}
 catch(e){$("#ge").textContent="Gagal: "+(e.message||e.code)}
};

/* voice call (WebRTC mesh, sinyal lewat room) - DM & grup */
let cc=null,ls=null,pcs={},qs={},inv=null;
const sig=d=>room.emit("call",{from:me.u,nick:users[me.u]?.nick||me.n,...d});
const mem=c=>c==="public"||(c.startsWith("dm~")?c.split("~").includes(me.u):(groups[c.slice(2)]?.members||[]).includes(me.u));
const cname=c=>c==="public"?PUB.name:c.startsWith("dm~")?(users[c.split("~").find(x=>x!=="dm"&&x!==me.u)]?.nick||"Kontak"):(groups[c.slice(2)]?.name||"Grup");
const cs=(n,s,ok,no)=>{$("#cmv").textContent=ini(n);$("#cmn").textContent=n;$("#cms").textContent=s;$("#cok").style.display=ok?"block":"none";$("#cno").textContent=no;$("#cm").classList.add("on")};
const stat=()=>{const n=Object.values(pcs).filter(p=>p.connectionState==="connected").length;if(cc)$("#cms").textContent=n?"Tersambung · "+n+" peserta 🔊":"Menunggu peserta lain…"};
function mkpc(p){
 const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pcs[p]=pc;qs[p]=qs[p]||[];
 pc.onicecandidate=e=>e.candidate&&sig({k:"ice",c:cc,to:p,d:e.candidate});
 pc.ontrack=e=>{let a=document.getElementById("a_"+p);if(!a){a=document.createElement("audio");a.id="a_"+p;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0]};
 pc.onconnectionstatechange=stat;
 ls.getTracks().forEach(t=>pc.addTrack(t,ls));return pc}
async function join(c){
 try{ls=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$("#cm").classList.remove("on");alert("Mikrofon tidak bisa dipakai di sini: "+(e.message||e.name));return}
 cc=c;cs(cname(c),"Menunggu peserta lain…",0,"Akhiri");sig({k:"join",c});
}
function drop(p){if(pcs[p])pcs[p].close();delete pcs[p];delete qs[p];const a=document.getElementById("a_"+p);if(a)a.remove()}
function leave(tell){
 if(tell&&cc)sig({k:"bye",c:cc});Object.keys(pcs).forEach(drop);if(ls)ls.getTracks().forEach(t=>t.stop());ls=cc=inv=null;$("#cm").classList.remove("on")}
async function offerTo(p){if(pcs[p]||me.u<=p)return;const pc=mkpc(p),o=await pc.createOffer();await pc.setLocalDescription(o);sig({k:"offer",c:cc,to:p,s:o})}
$("#cal").onclick=()=>{if(cur&&!cc)join(cur.id)};
$("#cno").onclick=()=>{if(inv&&!cc){inv=null;$("#cm").classList.remove("on")}else leave(1)};
$("#cok").onclick=()=>{if(!inv)return;const c=inv.c;inv=null;join(c)};
async function onSig(m){
 const d=m.data;if(!d||!me||m.isMe||d.from===me.u||!d.c||!mem(d.c))return;
 if(d.to&&d.to!==me.u)return;const p=d.from;
 try{
  if(d.k==="join"){
   if(cc===d.c){sig({k:"hi",c:cc,to:p});offerTo(p)}
   else if(!cc&&!inv){inv=d;cs(d.nick||p,"Ajak panggilan suara · "+cname(d.c),1,"Tolak")}
  }else if(d.k==="hi"){if(cc===d.c)offerTo(p)}
  else if(d.k==="offer"&&cc===d.c){const pc=pcs[p]||mkpc(p);await pc.setRemoteDescription(d.s);for(const c of qs[p]||[])await pc.addIceCandidate(c);qs[p]=[];const a=await pc.createAnswer();await pc.setLocalDescription(a);sig({k:"ans",c:cc,to:p,s:a})}
  else if(d.k==="ans"&&pcs[p]){await pcs[p].setRemoteDescription(d.s);for(const c of qs[p]||[])await pcs[p].addIceCandidate(c);qs[p]=[]}
  else if(d.k==="ice"&&cc===d.c){const pc=pcs[p];if(pc&&pc.remoteDescription)await pc.addIceCandidate(d.d);else(qs[p]=qs[p]||[]).push(d.d)}
  else if(d.k==="bye"){if(cc===d.c){drop(p);if(d.c.startsWith("dm~")&&!Object.keys(pcs).length)leave(0);else stat()}else if(inv&&inv.from===p){inv=null;$("#cm").classList.remove("on")}}
 }catch(e){}
}

/* pesan suara (tap untuk rekam, tap lagi untuk kirim, maks 30 dtk) */
let rec=null,rt=null;
$("#mic").onclick=async()=>{
 if(rec){rec.stop();return}
 if(!cur)return;
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:true}),to=cur.id,t0=Date.now(),ch=[],r=new MediaRecorder(st,{audioBitsPerSecond:16000});rec=r;
  const tick=()=>{const s=Math.floor((Date.now()-t0)/1000);$("#txt").placeholder="Merekam… "+s+" dtk (tap ⏹ untuk kirim)";if(s>=30)r.stop()};
  r.ondataavailable=e=>ch.push(e.data);
  r.onstop=()=>{clearInterval(rt);st.getTracks().forEach(t=>t.stop());rec=null;$("#mic").textContent="🎤";$("#mic").classList.remove("rec");$("#txt").placeholder="Ketik pesan";
   if(Date.now()-t0<1000)return;
   const fr=new FileReader();fr.onload=()=>{if(fr.result.length>230000)alert("Pesan suara terlalu panjang");else send("v",fr.result,to)};fr.readAsDataURL(new Blob(ch,{type:r.mimeType}))};
  r.start();$("#mic").textContent="⏹";$("#mic").classList.add("rec");tick();rt=setInterval(tick,500);
 }catch(e){alert("Mikrofon tidak bisa dipakai di sini: "+(e.message||e.name))}
};
init();
</script></body></html>
